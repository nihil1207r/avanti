<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avanti Pizza Botoșani — Pizza artizanală, burgeri și preparate premium</title>
    <meta name="description" content="Tradiție italiană în inima Botoșaniului. Pizza artizanală, burgeri suculenți și preparate premium. Comandă: 0745 383 256." />
    <meta name="author" content="Avanti Pizza" />
    <meta name="theme-color" content="#C0392B" />

    <!-- Security headers via meta (complements server-level headers) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
    <!--
      Content-Security-Policy:
      - default-src 'self'
      - scripts: self + inline (required by Vite HMR) + supabase CDN
      - styles: self + unsafe-inline (required by Tailwind JIT)
      - images: self + blob: (previews) + supabase storage + data URIs
      - connect: self + supabase project
      - frame-ancestors: none (stronger than X-Frame-Options for modern browsers)
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
      img-src 'self' blob: data: https://ipakwhqygsltsjixmgec.supabase.co;
      connect-src 'self' https://ipakwhqygsltsjixmgec.supabase.co wss://ipakwhqygsltsjixmgec.supabase.co;
      font-src 'self' data:;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <meta property="og:title" content="Avanti Pizza Botoșani" />
    <meta property="og:description" content="Pizza artizanală, burgeri și preparate premium în Botoșani." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
